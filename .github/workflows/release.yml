name: Build & Release R36S Port

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto tag)'
        required: false
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        default: ''
      draft:
        description: 'Create as Draft Release'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    # Run only if triggered manually OR if a pull request was merged (not simply closed/rejected)
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install ARM64 Cross-Compiler & SDL2 Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libsdl2-dev \
            zip \
            curl \
            tar \
            python3

      - name: Retrieve Precompiled Guest Objects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/guest-archives build/guest-objs
          OBJS_FOUND=false

          # 1. Check if user configured a direct URL secret
          if [ -n "${{ secrets.GUEST_OBJS_URL }}" ]; then
            echo "[INFO] Downloading guest objects from GUEST_OBJS_URL secret..."
            if curl -fSL "${{ secrets.GUEST_OBJS_URL }}" -o build/guest-archives/guest-objs.tar.gz; then
              OBJS_FOUND=true
            fi
          fi

          # 2. Check if a base assets release exists on the repository
          if [ "$OBJS_FOUND" = "false" ]; then
            echo "[INFO] Checking for guest objects in repository releases..."
            for rel in "r36s-guest-objs" "r36s-base-assets"; do
              if gh release download "$rel" -p "*.tar.gz" -D build/guest-archives --repo "${{ github.repository }}" 2>/dev/null; then
                OBJS_FOUND=true
                break
              fi
            done
            if [ "$OBJS_FOUND" = "false" ]; then
              if curl -fsSL "https://github.com/${{ github.repository }}/releases/download/r36s-base-assets/r36s-guest-objs.tar.gz" -o build/guest-archives/guest-objs.tar.gz 2>/dev/null; then
                OBJS_FOUND=true
              fi
            fi
          fi

          # 3. Extract each archive to its own directory
          if [ "$OBJS_FOUND" = "true" ]; then
            for archive in build/guest-archives/*.tar.gz; do
              [ -f "$archive" ] || continue
              bname=$(basename "$archive" .tar.gz)
              mkdir -p "build/guest-objs/$bname"
              tar -xzf "$archive" -C "build/guest-objs/$bname"
            done
            COUNT=$(find build/guest-objs -name '*.o' | wc -l | tr -d ' ')
            if [ "$COUNT" -gt 0 ]; then
              echo "[SUCCESS] Extracted $COUNT precompiled guest objects."
              echo "HAVE_GUEST_OBJS=true" >> $GITHUB_ENV
            else
              echo "[WARNING] No *.o files found in archives."
              echo "HAVE_GUEST_OBJS=false" >> $GITHUB_ENV
            fi
          else
            echo "[WARNING] Precompiled guest objects not found."
            echo "To enable automated binary compilation in CI:"
            echo "1. Upload 'guest-objs-v10.tar.gz' or 'guest-objs-v12.tar.gz' to a GitHub Release tagged 'r36s-guest-objs' (or run: python build.py --export-guest --publish)"
            echo "   OR"
            echo "2. Add a repository secret named 'GUEST_OBJS_URL' with a direct download link."
            echo "HAVE_GUEST_OBJS=false" >> $GITHUB_ENV
          fi

      - name: Build R36S Binary (ARM64)
        if: env.HAVE_GUEST_OBJS == 'true'
        run: |
          OUT="$GITHUB_WORKSPACE/ports/r36s/package"
          mkdir -p "$OUT"
          for guest_dir in "$GITHUB_WORKSPACE"/build/guest-objs/*; do
            [ -d "$guest_dir" ] || continue
            cnt=$(find "$guest_dir" -name '*.o' | wc -l | tr -d ' ')
            [ "$cnt" -gt 0 ] || continue

            dname=$(basename "$guest_dir")
            echo "============================================================"
            echo " Building variant from $dname ($cnt objects)..."
            echo "============================================================"

            VARIANT=""
            if [ -f "$guest_dir/guest.key" ]; then
              VARIANT=$(grep -m1 '^variant ' "$guest_dir/guest.key" | awk '{print $2}')
            fi
            if [ -z "$VARIANT" ]; then
              case "$dname" in
                *v10*) VARIANT="v10" ;;
                *v12*) VARIANT="v12" ;;
              esac
            fi

            EXE_VAR=""
            OUT_NAME="nfsu2.aarch64"
            if [ "$VARIANT" = "v10" ]; then
              OUT_NAME="nfsu2.aarch64.v10"
              EXE_VAR="1"
            elif [ "$VARIANT" = "v12" ]; then
              OUT_NAME="nfsu2.aarch64.v12"
              EXE_VAR="2"
            fi

            GUEST_DIR="$guest_dir" \
            BUILD_DIR="$GITHUB_WORKSPACE/build/ci-r36s-$dname" \
            OUT="$OUT" \
            OUT_NAME="$OUT_NAME" \
            NFS_EXE_VARIANT="$EXE_VAR" \
            bash ports/r36s/build_ci.sh
          done

          # Ensure a fallback nfsu2.aarch64 exists if only versioned binaries were generated
          if [ ! -f "$OUT/nfsu2.aarch64" ]; then
            if [ -f "$OUT/nfsu2.aarch64.v12" ]; then
              cp "$OUT/nfsu2.aarch64.v12" "$OUT/nfsu2.aarch64"
            elif [ -f "$OUT/nfsu2.aarch64.v10" ]; then
              cp "$OUT/nfsu2.aarch64.v10" "$OUT/nfsu2.aarch64"
            fi
          fi

      - name: Package PortMaster Release Bundle
        run: |
          STAGE_DIR="$GITHUB_WORKSPACE/build/package_stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/nfsu2/gamedata"

          cp "$GITHUB_WORKSPACE/ports/r36s/package/NFSU2.sh" "$STAGE_DIR/"
          cp "$GITHUB_WORKSPACE/ports/r36s/package/port.json" "$STAGE_DIR/nfsu2/"
          cp "$GITHUB_WORKSPACE/ports/r36s/package/nfsu2.gptk" "$STAGE_DIR/nfsu2/"
          cp "$GITHUB_WORKSPACE/ports/r36s/package/README.md" "$STAGE_DIR/nfsu2/"
          cp "$GITHUB_WORKSPACE/ports/r36s/package/nfsu2.cfg" "$STAGE_DIR/nfsu2/"
          cp -r "$GITHUB_WORKSPACE/ports/r36s/package/widescreen" "$STAGE_DIR/nfsu2/"

          printf "%s\n" \
            "Need for Speed: Underground 2 — PortMaster" \
            "==========================================" \
            "" \
            "Copy your retail PC game files here:" \
            "- SPEED2.EXE" \
            "- GLOBAL/" \
            "- CARS/" \
            "- TRACKS/" \
            "- SOUND/" \
            "- MOVIES/" \
            "- LANGUAGES/" \
            > "$STAGE_DIR/nfsu2/gamedata/COPY_RETAIL_PC_FILES_HERE.txt"

          BIN_COPIED=false
          for b in "$GITHUB_WORKSPACE/ports/r36s/package"/nfsu2.aarch64*; do
            if [ -f "$b" ]; then
              cp "$b" "$STAGE_DIR/nfsu2/"
              echo "Package contains $(basename "$b")."
              BIN_COPIED=true
            fi
          done
          if [ "$BIN_COPIED" = "false" ]; then
            echo "Package created without binary (base port configuration)."
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          (cd "$STAGE_DIR" && zip -r "$GITHUB_WORKSPACE/dist/NFSU2-R36S.zip" NFSU2.sh nfsu2)

          cd "$GITHUB_WORKSPACE/dist"
          sha256sum NFSU2-R36S.zip > NFSU2-R36S.zip.sha256

      - name: Generate Release Tag & Info
        id: release_info
        run: |
          DATE_TAG="$(date +'%Y%m%d')"
          SHORT_SHA="$(git rev-parse --short HEAD)"

          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.number }}"
            TAG="v1.0.0-r36s-pr${PR_NUM}-${SHORT_SHA}"
          else
            TAG="v1.0.0-r36s-${DATE_TAG}-${SHORT_SHA}"
          fi

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TITLE="NFSU2 R36S Port - PR #${{ github.event.number }}"
          else
            TITLE="NFSU2 R36S Release ${TAG}"
          fi

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TITLE=$TITLE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: ${{ steps.release_info.outputs.TITLE }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == true }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/NFSU2-R36S.zip
            dist/NFSU2-R36S.zip.sha256
          body: |
            ## 🏎️ Need for Speed: Underground 2 — R36S & PortMaster Release

            - **Target Platform**: Rockchip RK3326 (R36S, RG351MP, RGB20S) / Linux ARM64
            - **Operating System**: ArkOS, AmberELEC, ROCKNIX
            - **Graphics**: MojoShader Direct3D 9 to OpenGL ES 2.0 native translation
            - **Commit**: ${{ github.sha }}

            ### 🙏 Acknowledgements & Credits
            Special thanks to **codepdbh** and contributors to the [NFSU2 Recompiled project](https://github.com/codepdbh/nfsu2-recompiled) for making this native recompiled engine possible!

            ### 💾 Installation:
            1. Download `NFSU2-R36S.zip` and extract to your SD card under `ports/`.
            2. Copy your legitimate retail PC Need for Speed: Underground 2 files into `ports/nfsu2/gamedata/` (`SPEED2.EXE`, `GLOBAL/`, `CARS/`, `TRACKS/`, `SOUND/`, etc.).
            3. Launch from your handheld's Ports menu.
