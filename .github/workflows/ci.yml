name: CI Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'ports/**'
      - 'src/**'
      - 'third_party/**'
      - 'android/app/src/main/cpp/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Compile R36S Translation Layer & Runtime
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM64 Cross Toolchain & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            python3

      - name: Compile Translation Runtime & Engine Overrides
        run: |
          COMPILE_ONLY=1 bash ports/r36s/build_ci.sh
