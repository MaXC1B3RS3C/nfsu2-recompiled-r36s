# NFSU2 settings, read by NFSU2.sh at launch.
# Graphics: performance | balanced | quality
NFSU2_GRAPHICS=performance
# Frame cap: 30 or 60
NFSU2_FPS=30
# Language: English | Spanish | French | German | Italian
NFSU2_LANG=English
# Extra game options, e.g. "g_CrowdEnable=0;g_FogEnable=0"
NFSU2_REGISTRY_EXTRA=""
# Draw distance in metres: scenery wholly beyond it is skipped and the fog is opaque there,
# so nothing pops. Lower = faster but foggier; 0 = the game's own distance.
NFSU2_DRAW_DIST=200
